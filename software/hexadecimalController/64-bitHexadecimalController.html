<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>64-bit Hexadecimal Switches</title>
        <style>
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f8fafc;
                --btn-off-bg: #334155;
                --btn-off-border: #475569;
                --btn-on-bg: #10b981;
                --hex-color: #38bdf8;
                --input-focus: #2563eb;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-color);
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                margin-top: 0;
                margin-bottom: 30px;
                color: var(--hex-color);
                text-align: center;
            }

            /* Grid for 16 groups, ordered from right to left */
            .grid-container {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                max-width: 1200px;
                width: 100%;
                direction: rtl; /* Forces groups to start from right to left */
            }

            /* Card holding the hex input and 4 switches */
            .hex-group {
                background-color: var(--card-bg);
                padding: 20px;
                border-radius: 12px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                display: flex;
                flex-direction: column;
                align-items: center;
                transition: transform 0.2s;
                direction: ltr; /* Keeps content inside the card rendering properly */
            }

            .hex-group:hover {
                transform: translateY(-2px);
            }

            /* Interactive Hex input field */
            .hex-input {
                font-size: 2.5rem;
                font-weight: bold;
                color: var(--hex-color);
                margin-bottom: 15px;
                font-family: "Courier New", Courier, monospace;
                background: #0f172a;
                padding: 5px 10px;
                border-radius: 8px;
                width: 50px;
                text-align: center;
                border: 2px solid #334155;
                text-transform: uppercase;
                outline: none;
                transition: border-color 0.2s;
            }

            .hex-input:focus {
                border-color: var(--input-focus);
                box-shadow: 0 0 8px rgba(37, 99, 235, 0.5);
            }

            /* Row holding the 4 buttons */
            .buttons-row {
                display: flex;
                gap: 10px;
                /* Flex row reverse aligns C0 on the right, C3 on the left */
                flex-direction: row-reverse;
            }

            /* Switch buttons design */
            .switch-btn {
                background-color: var(--btn-off-bg);
                color: #94a3b8;
                border: 2px solid var(--btn-off-border);
                border-radius: 8px;
                width: 50px;
                height: 50px;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Active state for switches (when value is 1) */
            .switch-btn.active {
                background-color: var(--btn-on-bg);
                color: #ffffff;
                border-color: var(--btn-on-bg);
                box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
            }

            .switch-btn:hover {
                filter: brightness(1.2);
            }

            /* Responsive design */
            @media (max-width: 1024px) {
                .grid-container {
                    grid-template-columns: repeat(2, 1fr);
                }
            }

            @media (max-width: 600px) {
                .grid-container {
                    grid-template-columns: repeat(1, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <h1>64-bit Hexadecimal Controller</h1>
        <div class="grid-container" id="main-grid">
            <!-- Elements will be generated here by JavaScript -->
        </div>

        <script>
            const gridContainer = document.getElementById("main-grid");
            const TOTAL_BUTTONS = 64;
            const BUTTONS_PER_GROUP = 4;
            const TOTAL_GROUPS = TOTAL_BUTTONS / BUTTONS_PER_GROUP; // 16 Groups

            // Bit weights mapping: 2^0, 2^1, 2^2, 2^3
            const BIT_WEIGHTS = [1, 2, 4, 8];

            // Generate UI dynamically
            for (let i = 0; i < TOTAL_GROUPS; i++) {
                const groupDiv = document.createElement("div");
                groupDiv.className = "hex-group";

                // Create Hexadecimal input field
                const hexInput = document.createElement("input");
                hexInput.type = "text";
                hexInput.className = "hex-input";
                hexInput.id = `hex-input-${i}`;
                hexInput.value = "0";
                hexInput.maxLength = 1; // Only allow one Hex character

                // Event listener for manual Hex input
                hexInput.addEventListener("input", function (e) {
                    // Filter input: allow only 0-9, a-f, A-F
                    const validHex = /^[0-9A-Fa-f]$/;
                    let val = this.value;

                    if (!validHex.test(val) && val !== "") {
                        this.value = "0"; // Reset to 0 if invalid
                        val = "0";
                    }

                    if (val === "") {
                        val = "0"; // Handle empty input
                    }

                    // Update switches based on the new Hex value
                    updateSwitchesFromHex(i, val);
                });

                // Prevent input field from losing focus immediately on click
                hexInput.addEventListener("click", function () {
                    this.select();
                });

                const buttonsRow = document.createElement("div");
                buttonsRow.className = "buttons-row";

                // Create 4 buttons for each group (C0 to C63)
                for (let j = 0; j < BUTTONS_PER_GROUP; j++) {
                    const btnNumber = i * BUTTONS_PER_GROUP + j;

                    const btn = document.createElement("button");
                    btn.className = "switch-btn";
                    btn.innerText = `C${btnNumber}`;

                    btn.dataset.group = i;
                    btn.dataset.weight = BIT_WEIGHTS[j];
                    btn.dataset.index = j; // Index within the group (0 to 3)
                    btn.dataset.state = "0";

                    // Click event for switches
                    btn.addEventListener("click", function () {
                        this.dataset.state = this.dataset.state === "0" ? "1" : "0";
                        this.classList.toggle("active");

                        // Update the corresponding Hex input
                        updateHexFromSwitches(this.dataset.group);
                    });

                    buttonsRow.appendChild(btn);
                }

                groupDiv.appendChild(hexInput);
                groupDiv.appendChild(buttonsRow);
                gridContainer.appendChild(groupDiv);
            }

            // Function to calculate Hex value when switches are clicked
            function updateHexFromSwitches(groupId) {
                const buttons = document.querySelectorAll(`.switch-btn[data-group="${groupId}"]`);
                let sum = 0;

                buttons.forEach((btn) => {
                    if (btn.dataset.state === "1") {
                        sum += parseInt(btn.dataset.weight);
                    }
                });

                const hexValue = sum.toString(16).toUpperCase();
                document.getElementById(`hex-input-${groupId}`).value = hexValue;
            }

            // Function to update switches when Hex input is manually typed
            function updateSwitchesFromHex(groupId, hexValue) {
                // Convert Hex character to an integer (0 to 15)
                const decimalValue = parseInt(hexValue, 16);

                const buttons = document.querySelectorAll(`.switch-btn[data-group="${groupId}"]`);

                buttons.forEach((btn) => {
                    const weight = parseInt(btn.dataset.weight);

                    // Use bitwise AND to check if the specific bit is set (1 or 0)
                    if ((decimalValue & weight) === weight) {
                        btn.dataset.state = "1";
                        btn.classList.add("active");
                    } else {
                        btn.dataset.state = "0";
                        btn.classList.remove("active");
                    }
                });
            }
        </script>
    </body>
</html>
